[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evobot"
version = "0.1.0"
description = "BDDL formal spec + reusable skills for the LIBERO robot manipulation benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "李飞达", email = "1607741781@qq.com" },
]
keywords = ["robotics", "manipulation", "libero", "bddl", "skill-library", "mujoco"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# 只列本项目自身直接依赖；LIBERO / robosuite / mujoco / torch 由外部环境提供
dependencies = [
    "numpy>=1.20",
    "pyyaml>=5.4",
    "h5py>=3.0",
]

[project.optional-dependencies]
# 录像与感知可视化
video = ["opencv-python", "opencv-contrib-python"]
# 轨迹规划
planning = ["ruckig~=0.9.2"]
dev = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/ABC12345anouys/EvoBot"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
# 只打包 darwin 包
include = ["darwin*"]

[tool.setuptools.package-data]
darwin = [
    "assets/profiles/*.yaml",
    "skills/configs/*.yaml",
    "skills/configs/task_specs/*.yaml",
]
