[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragbot"
version = "0.1.0"
description = "RAG-based manipulation experience memory layer for LLM-driven robot arm control"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "李飞达", email = "1607741781@qq.com" },
]
keywords = ["robotics", "rag", "memory", "llm", "manipulation", "grasp"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20",
    "pyyaml>=5.4",
]

[project.optional-dependencies]
# 语义检索 embedding 后端（默认 TF-IDF，不下载模型）
embed = ["sentence-transformers>=2.2"]
# 开发/测试
dev = ["pytest>=7.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
# 只打包 ragbot 包（不打包 darwin / robopal）
include = ["ragbot*"]

[tool.setuptools.package-data]
ragbot = ["memory/experience/*.md"]
